<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaVault | Private Repository</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; transition: direction 0.3s ease; }
        /* Performance optimized for 1.80GHz CPUs */
        .glass-card { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px); border: 1px solid rgba(59, 130, 246, 0.05); transition: 0.2s ease; }
        .bg-grid { background-image: radial-gradient(circle at 2px 2px, rgba(59, 130, 246, 0.03) 1px, transparent 0); background-size: 40px 40px; }
        .modal-active { transform: scale(1) !important; opacity: 1 !important; }
        
        #mainContent.is-blurred { filter: blur(15px); pointer-events: none; user-select: none; }
        #adGuard { backdrop-filter: blur(10px); transition: all 0.4s ease; }
        
        body[dir="rtl"] .text-left { text-align: right; }
        body[dir="rtl"] #searchInput { text-align: right; }
    </style>
</head>
<body class="bg-grid text-slate-200 min-h-screen pb-20">

<div id="adGuard" class="fixed inset-0 z-[200] flex items-center justify-center bg-black/70 px-4">
    <div class="bg-slate-900 border border-blue-500/30 p-8 rounded-[2.5rem] shadow-2xl text-center max-w-sm w-full">
        <div class="w-16 h-16 bg-blue-600/20 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
        </div>
        <h2 class="text-2xl font-bold text-white mb-2 uppercase tracking-tighter">Vault Locked</h2>
        <p class="text-slate-400 text-sm mb-6 uppercase tracking-wider">Unlock the repository to view data nodes.</p>
        <button id="unlockBtn" onclick="startUnlock()" class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-black uppercase rounded-2xl shadow-lg shadow-blue-600/20 transition-all">
            🚀 Unlock Now
        </button>
    </div>
</div>

<div id="mainContent" class="is-blurred">
    <nav class="border-b border-white/5 bg-slate-950/80 sticky top-0 z-50 backdrop-blur-md px-4 md:px-8 py-4 flex justify-between items-center">
        <h1 class="text-xl md:text-2xl font-bold text-white tracking-tighter cursor-pointer" onclick="window.location.reload()">MEDIA<span class="text-blue-500">VAULT</span></h1>
        <div class="flex items-center gap-2 md:gap-4">
            <select id="langSelect" onchange="changeLanguage()" class="bg-white/5 text-slate-300 text-[10px] font-bold px-2 py-1 rounded border border-white/10 outline-none">
                <option value="en">EN</option>
                <option value="es">ES</option>
                <option value="ar">AR</option>
            </select>
            <button onclick="requestGame()" id="reqMainBtn" class="bg-blue-600/10 hover:bg-blue-600/20 text-blue-400 text-[10px] font-bold px-3 py-1 rounded border border-blue-500/20 uppercase">Request</button>
        </div>
    </nav>

    <header class="max-w-7xl mx-auto px-6 pt-12 md:pt-16 pb-12 text-center">
        <h2 id="mainTitle" class="text-3xl md:text-5xl font-extrabold text-white mb-6 uppercase tracking-tight">The Golden Age <br><span class="text-blue-500">In Your Pocket.</span></h2>
        <p id="subHeader" class="text-slate-400 text-base md:text-lg mb-10 uppercase tracking-widest font-light">Decrypt data nodes and initialize downloads.</p>
        <button onclick="triggerAdOnly()" id="mainAdBtn" class="px-8 py-4 bg-blue-600 hover:bg-blue-500 text-white font-black rounded-2xl transition-all shadow-xl shadow-blue-600/30">🚀 SUPPORT THE VAULT</button>
    </header>

    <div class="max-w-7xl mx-auto px-6 mb-12">
        <div class="flex flex-col md:flex-row gap-4 justify-between items-center bg-slate-900/40 p-2 rounded-2xl border border-white/5 mb-8">
            <input type="text" id="searchInput" onkeyup="searchVault()" placeholder="Search directory..." class="bg-transparent w-full px-6 py-3 outline-none text-white font-medium uppercase text-xs tracking-widest">
            <select id="typeFilter" onchange="searchVault()" class="w-full md:w-auto bg-slate-800 text-white px-6 py-3 rounded-xl font-bold text-xs uppercase border border-white/10">
                <option value="all">All Platforms</option>
                <option value="pc">PC Games</option>
                <option value="quest">Meta Quest</option>
                <option value="psp">PSP</option>
                <option value="ps1">PS1</option>
            </select>
        </div>
        <main id="vaultGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8"></main>
    </div>
</div>

<div id="gameOverlay" class="fixed inset-0 z-[100] hidden items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/80 backdrop-blur-md" onclick="closeOverlay()"></div>
    <div id="modalBox" class="relative w-full max-w-lg bg-[#0d1117] border border-blue-500/20 rounded-[2.5rem] overflow-hidden shadow-2xl scale-90 opacity-0 transition-all duration-200">
        <img id="overlayImg" src="" class="w-full h-48 md:h-56 object-cover grayscale hover:grayscale-0 transition-all">
        <div class="p-6 md:p-8">
            <h2 id="overlayTitle" class="text-2xl md:text-3xl font-black uppercase text-white mb-2 leading-tight tracking-tighter"></h2>
            <div class="flex flex-wrap gap-2 mb-4">
                <span id="overlaySize" class="bg-blue-600/20 text-blue-400 text-[10px] font-bold px-3 py-1 rounded-full border border-blue-500/30"></span>
                <span id="overlayTag" class="bg-white/5 text-gray-400 text-[10px] px-3 py-1 rounded-full border border-white/10 uppercase"></span>
            </div>
            <p id="overlayDesc" class="text-slate-400 text-sm mb-8 leading-relaxed font-light"></p>
            <div class="flex flex-col gap-3">
                <button id="downloadBtn" onclick="triggerDownload()" class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white text-center font-black uppercase rounded-2xl shadow-lg transition-all tracking-widest text-xs">Download File</button>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="copyGameLink()" class="py-3 bg-white/5 hover:bg-white/10 text-white text-center font-bold uppercase rounded-xl border border-white/10 transition-all text-[10px]">Share</button>
                    <button id="reportBtn" onclick="reportLink()" class="py-3 bg-red-500/10 hover:bg-red-500/20 text-red-400 text-center font-bold uppercase rounded-xl border border-red-500/20 transition-all text-[10px]">Report</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const WEBHOOK_REPORTS = "https://discord.com/api/webhooks/1480201609618391112/zXvraiW-sH1F9ksTE3fbprA91nvLi5R-2wZQRj0hJVqHXlekQHg5ZyjfAKbsPPDSSYtI";
    const WEBHOOK_REQUESTS = "https://discord.com/api/webhooks/1480205130560176220/dsoePE0ouSFmduLF6XWiYQKTny_HNa81Hw1Mz9ho2BhG7VsSfS9jbWruypxpaezHgaEg";
    const AD_LINK = "https://www.effectivegatecpm.com/nu5nxhvxu?key=3c2836e0c24cca58b18b7f39e72f03c6";

    let allGames = [];
    let currentOpenGame = null;
    let currentDriveId = null;

    const i18n = {
        en: { title: 'The Golden Age <br><span class="text-blue-500">In Your Pocket.</span>', subHeader: "Decrypt data nodes and initialize downloads.", search: "Search directory...", all: "All Platforms", support: "🚀 SUPPORT THE VAULT", download: "Download File", wait: "INIT ", unlock: "DECRYPT NODE 🔓", close: "Back to Vault", share: "Share", copied: "COPIED! ✅", report: "Report", sent: "Reported! 🚨", req: "Request Game", reqSent: "Requested! ✅", prompt: "Enter title for entry request:" },
        es: { title: 'La Edad de Oro <br><span class="text-blue-500">En Tu Bolsillo.</span>', subHeader: "Descifra nodos de datos e inicia descargas.", search: "Buscar directorio...", all: "Todas las plataformas", support: "🚀 APOYA EL VAULT", download: "Descargar Archivo", wait: "CARGA ", unlock: "DESBLOQUEAR 🔓", close: "Volver al Vault", share: "Compartir", copied: "¡COPIADO! ✅", report: "Reportar", sent: "¡Enviado! 🚨", req: "Pedir Juego", reqSent: "¡Pedido! ✅", prompt: "Nombre del juego solicitado:" },
        ar: { title: 'العصر الذهبي <br><span class="text-blue-500">في جيبك.</span>', subHeader: "فك تشفير العناوين وابدأ التحميل.", search: "البحث في القائمة...", all: "جميع الأجهزة", support: "🚀 ادعم الموقع", download: "تحميل الملف", wait: "انتظار ", unlock: "فتح التحميل 🔓", close: "رجوع للقائمة", share: "مشاركة", copied: "تم النسخ! ✅", report: "إبلاغ", sent: "تم الإبلاغ! 🚨", req: "طلب لعبة", reqSent: "تم الطلب! ✅", prompt: "أدخل اسم اللعبة التي تريدها:" }
    };

    function startUnlock() {
        const unlockBtn = document.getElementById('unlockBtn');
        const lang = document.getElementById('langSelect').value;
        window.open(AD_LINK, '_blank');
        let timeLeft = 5;
        unlockBtn.disabled = true;
        unlockBtn.style.opacity = "0.6";
        const timer = setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) {
                clearInterval(timer);
                document.getElementById('adGuard').classList.add('opacity-0', 'pointer-events-none');
                document.getElementById('mainContent').classList.remove('is-blurred');
                setTimeout(() => document.getElementById('adGuard').remove(), 500);
            } else {
                unlockBtn.innerText = (i18n[lang].wait || "WAIT ") + timeLeft + "s...";
            }
        }, 1000);
    }

    function triggerAdOnly() { window.open(AD_LINK, '_blank'); }

    // DOWNLOAD TRIGGER (CLEAN - NO AD)
    function triggerDownload() {
        if (!currentDriveId) return;
        window.location.href = `https://drive.google.com/uc?export=download&id=${currentDriveId}`;
    }

    function changeLanguage() {
        const lang = document.getElementById('langSelect').value;
        const dict = i18n[lang];
        document.getElementById('mainTitle').innerHTML = dict.title;
        document.getElementById('subHeader').innerText = dict.subHeader;
        document.getElementById('searchInput').placeholder = dict.search;
        document.getElementById('mainAdBtn').innerText = dict.support;
        document.getElementById('reqMainBtn').innerText = dict.req;
        document.getElementById('typeFilter').options[0].text = dict.all;
        document.body.dir = lang === 'ar' ? 'rtl' : 'ltr';
    }

    async function loadVault() {
        try {
            const res = await fetch('./vault-data.json?t=' + Date.now());
            allGames = await res.json();
            renderGrid(allGames);
            checkDeepLink();
        } catch (e) {
            console.error("Data load error.");
        }
    }

    function renderGrid(games) {
        const grid = document.getElementById('vaultGrid');
        grid.innerHTML = games.map((game, index) => `
            <div class="group glass-card rounded-[2rem] overflow-hidden cursor-pointer" 
                 onclick="openOverlayByIndex(${index})">
                <div class="relative h-48 overflow-hidden">
                    <img src="${game.cover}" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-500">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#020617] via-transparent to-transparent"></div>
                </div>
                <div class="p-6">
                    <h3 class="text-xl font-bold text-white uppercase tracking-tighter">${game.title}</h3>
                    <p class="text-blue-500 text-[9px] font-black mt-1 uppercase tracking-[0.2em]">${game.tag} • ${game.size}</p>
                </div>
            </div>`).join('');
    }

    function openOverlayByIndex(index) {
        const g = allGames[index];
        openOverlay(g.title, g.cover, g.size, g.tag, g.desc, g.driveId);
    }

    function searchVault() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const f = document.getElementById('typeFilter').value;
        renderGrid(allGames.filter(g => (f === 'all' || g.type === f) && g.title.toLowerCase().includes(q)));
    }

    function openOverlay(title, img, size, tag, desc, driveId) {
        const lang = document.getElementById('langSelect').value;
        currentOpenGame = title;
        currentDriveId = driveId;
        document.getElementById('overlayTitle').innerText = title;
        document.getElementById('overlayImg').src = img;
        document.getElementById('overlaySize').innerText = size;
        document.getElementById('overlayTag').innerText = tag;
        document.getElementById('overlayDesc').innerText = desc || "NODATA_AVAILABLE";
        const dlBtn = document.getElementById('downloadBtn');
        dlBtn.disabled = true;
        dlBtn.style.opacity = "0.5";
        let timeLeft = 3;
        const timer = setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) {
                clearInterval(timer);
                dlBtn.disabled = false;
                dlBtn.style.opacity = "1";
                dlBtn.innerText = i18n[lang].unlock;
            } else {
                dlBtn.innerText = i18n[lang].wait + timeLeft + "s...";
            }
        }, 1000);
        document.getElementById('gameOverlay').classList.replace('hidden', 'flex');
        setTimeout(() => document.getElementById('modalBox').classList.add('modal-active'), 10);
    }

    function closeOverlay() {
        document.getElementById('modalBox').classList.remove('modal-active');
        setTimeout(() => document.getElementById('gameOverlay').classList.replace('flex', 'hidden'), 200);
    }

    function copyGameLink() {
        const url = window.location.origin + window.location.pathname + '?game=' + encodeURIComponent(currentOpenGame);
        navigator.clipboard.writeText(url).then(() => alert("Linked!"));
    }

    async function reportLink() {
        await fetch(WEBHOOK_REPORTS, { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' }, 
            body: JSON.stringify({ content: "🚨 **BROKEN LINK**", embeds: [{ title: currentOpenGame, color: 15548997 }] }) 
        });
        alert("Reported!");
    }

    async function requestGame() {
        const lang = document.getElementById('langSelect').value;
        const game = prompt(i18n[lang].prompt);
        if (!game) return;
        await fetch(WEBHOOK_REQUESTS, { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' }, 
            body: JSON.stringify({ content: `📫 **REQUEST**: ${game}` }) 
        });
        alert("Logged!");
    }

    function checkDeepLink() {
        const params = new URLSearchParams(window.location.search);
        const gameTitle = params.get('game');
        if (gameTitle) {
            const game = allGames.find(x => x.title.toLowerCase() === decodeURIComponent(gameTitle).toLowerCase());
            if (game) openOverlay(game.title, game.cover, game.size, game.tag, game.desc, game.driveId);
        }
    }

    loadVault();
</script>
</body>
</html>
